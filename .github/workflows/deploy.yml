name: Deploy Tipply Dashboard

on:
  push:
    branches:
      - master
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Work out the version number
        id: version
        run: |
          # Production: the release tag on this commit (R<month>.<yy>.<nnn>, set by scripts/release.py).
          # Test: T<month>.<yy>.<nnn>, nnn = commits on dev so far this month.
          MONTH=$(date -u +%-m); YEAR=$(date -u +%y)
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            COUNT=$(git rev-list --count --since="$(date -u +%Y-%m-01T00:00:00Z)" HEAD)
            VERSION=$(printf "T%s.%s.%03d" "$MONTH" "$YEAR" "$COUNT")
          else
            VERSION=$(git tag --points-at HEAD --list 'R*' | sort -V | tail -n 1)
            if [ -z "$VERSION" ]; then VERSION="R$(git rev-parse --short HEAD)"; fi
          fi
          echo "Version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm install
          npm run build:production
          echo "{\"version\":\"$VITE_APP_VERSION\"}" > dist/version.json
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
          VITE_API_URL: ${{ github.ref == 'refs/heads/dev' && 'https://uhxejjh8s1.execute-api.us-east-1.amazonaws.com/dev' || 'https://uhxejjh8s1.execute-api.us-east-1.amazonaws.com/prod' }}

      - name: Sync to S3
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TARGET="s3://tipwave-sites-bucket/test"
          else
            TARGET="s3://tipwave-sites-bucket/app"
          fi
          echo "🚀 Deploying branch ${{ github.ref }} to $TARGET"

          # 1. The built scripts and styles (hashed names, never edited): cached for a year, and the PREVIOUS build's files are
          #    KEPT. A phone that still holds an older copy of the page therefore keeps working instead of failing to load.
          aws s3 sync dist/assets/ "$TARGET/assets/" --cache-control "public, max-age=31536000, immutable"

          # 2. Everything else (the page itself, icons, images, service worker): always checked again, and stale files removed.
          #    Without this the page was saved by browsers for a while after a deploy and pointed at files that no longer existed.
          aws s3 sync dist/ "$TARGET/" --delete --exclude "assets/*" --exclude "*.DS_Store" --cache-control "no-cache, must-revalidate"

          # 3. HTML must never be saved by a browser or the CDN's edge
          aws s3 cp dist/index.html "$TARGET/index.html" --content-type "text/html" --cache-control "no-cache, no-store, must-revalidate"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront cache
        run: |
          echo "🌐 Invalidating CloudFront cache for branch: ${{ github.ref }}"
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "🌐 Invalidating dev CloudFront (E2IU847MNWNNCH)"
            aws cloudfront create-invalidation \
              --distribution-id E2IU847MNWNNCH \
              --paths "/*"
          else
            echo "🌐 Invalidating prod CloudFront (E2XIM4NN5SEMR7)"
            aws cloudfront create-invalidation \
              --distribution-id E2XIM4NN5SEMR7 \
              --paths "/*"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
#nothing changes.
